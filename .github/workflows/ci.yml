name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core + dev)
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
        env:
          # isolate the suite from any global config on the runner
          HEXHARNESS_CONFIG: ${{ runner.temp }}/hh-cfg.json
          HEXHARNESS_PROVIDERS: ${{ runner.temp }}/hh-prov.json
