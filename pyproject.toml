[project]
name = "hexharness"
version = "1.0.0"
description = "Agentic pentesting harness with a hard domain control plane (scope, ROE, evidence, budget)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Matias Tillerias", email = "matias.tillerias@securehex.cl" }]
keywords = ["pentesting", "security", "agent", "llm", "offensive-security", "control-plane", "mitre-attack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "pyyaml>=6",
    "ddgs>=6.0",  # free default web_search backend (Tavily/Exa optional, via stdlib HTTP + key)
    "dnspython>=2.6",  # native dns_enum resolver (no sandbox tool needed)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
# Each group is lazy-imported; the core install and the test suite run without any of them.
openai = ["openai>=1.40"]        # also powers OllamaProvider (OpenAI-compatible endpoint)
google = ["google-genai>=0.3"]
otel = ["opentelemetry-sdk>=1.20"]
daemon = ["websockets>=12"]
reporting = ["jinja2>=3", "weasyprint>=60", "docxtpl>=0.16"]
mcp = ["mcp>=1.0"]
tui = ["textual>=0.60"]
browser = ["playwright>=1.40"]  # browser tool; run `playwright install chromium` after
secrets = ["cryptography>=42"]  # optional: encrypts the on-disk Vault at rest (Fernet); without it the vault stays in-memory
voice = ["sounddevice>=0.4", "faster-whisper>=1.0", "numpy>=1.26"]
search = ["ddgs>=6.0"]  # kept for back-compat; ddgs is now a core dep so web_search works out of the box
all = [
    "openai>=1.40", "google-genai>=0.3", "opentelemetry-sdk>=1.20",
    "websockets>=12", "jinja2>=3", "weasyprint>=60", "docxtpl>=0.16", "mcp>=1.0",
    "textual>=0.60", "sounddevice>=0.4", "faster-whisper>=1.0", "numpy>=1.26", "ddgs>=6.0",
    "cryptography>=42",
]

[project.urls]
Homepage = "https://github.com/Secure-Hex/hexharness"
Repository = "https://github.com/Secure-Hex/hexharness"
Issues = "https://github.com/Secure-Hex/hexharness/issues"

[project.scripts]
hexharness = "hexharness.__main__:main"

[tool.setuptools.packages.find]
include = ["hexharness*"]

# Non-.py data that must ship in the wheel: the Kali Dockerfile (so the sandbox image
# can be built from the installed package) plus skills/knowledge/reporting assets.
[tool.setuptools.package-data]
hexharness = [
    "sandbox/docker/*",
    "skills/library/**/*",
    "knowledge/data/**/*",
    "knowledge/corpus/**/*",
    "reporting/templates/**/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Automated versioning from Conventional Commits (python-semantic-release).
# feat: -> minor, fix:/perf: -> patch, "BREAKING CHANGE"/! -> major.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "pip install build && python -m build"
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"
major_on_zero = true
allow_zero_version = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]
