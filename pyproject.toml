[project]
name = "hexharness"
version = "1.6.1"
description = "Agentic pentesting harness with a hard domain control plane (scope, ROE, evidence, budget)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Matias Tillerias", email = "matias.tillerias@securehex.cl" }]
keywords = ["pentesting", "security", "agent", "llm", "offensive-security", "control-plane", "mitre-attack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
# Every runtime third-party import the package makes is a hard dependency: a plain
# `pip install hexharness` pulls everything, so no feature crashes on a missing module.
# NOTE: weasyprint (libpango/libcairo), sounddevice (PortAudio) and playwright (browser
# binaries, via `playwright install chromium`) also need SYSTEM libraries that pip cannot
# provide; those are an OS-level step, not a Python dependency.
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "openai>=1.40",          # OpenAI provider + OllamaProvider (OpenAI-compatible endpoint)
    "google-genai>=0.3",     # Google provider
    "httpx>=0.27",           # OAuth token refresh (providers/openai_oauth.py)
    "pyyaml>=6",
    "ddgs>=6.0",             # default web_search backend
    "dnspython>=2.6",        # native dns_enum resolver
    "textual>=0.60",         # TUI
    "rich>=13",              # TUI rendering (markdown/text)
    "jinja2>=3",             # report templating
    "weasyprint>=60",        # HTML->PDF report (needs libpango/libcairo at runtime)
    "docxtpl>=0.16",         # DOCX report templating
    "docx2pdf>=0.1.8",       # DOCX->PDF report step
    "mcp>=1.0",              # MCP tool transport
    "websockets>=12",        # daemon transport
    "opentelemetry-sdk>=1.20",  # observability
    "cryptography>=42",      # at-rest Vault encryption (Fernet)
    "playwright>=1.40",      # browser tool (needs `playwright install chromium` for binaries)
    "sounddevice>=0.4",      # voice dictation capture (needs PortAudio at runtime)
    "faster-whisper>=1.0",   # voice dictation transcription
    "numpy>=1.26",           # voice dictation audio buffers
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/Secure-Hex/hexharness"
Repository = "https://github.com/Secure-Hex/hexharness"
Issues = "https://github.com/Secure-Hex/hexharness/issues"

[project.scripts]
hexharness = "hexharness.__main__:main"

[tool.setuptools.packages.find]
include = ["hexharness*"]

# Non-.py data that must ship in the wheel: the Kali Dockerfile (so the sandbox image
# can be built from the installed package) plus skills/knowledge/reporting assets.
[tool.setuptools.package-data]
hexharness = [
    "sandbox/docker/*",
    "skills/library/**/*",
    "knowledge/data/**/*",
    "knowledge/corpus/**/*",
    "reporting/templates/**/*",
    "tui/*.tcss",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Automated versioning from Conventional Commits (python-semantic-release).
# feat: -> minor, fix:/perf: -> patch, "BREAKING CHANGE"/! -> major.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
build_command = "pip install build && python -m build"
commit_message = "chore(release): v{version} [skip ci]"
tag_format = "v{version}"
major_on_zero = true
allow_zero_version = false

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\):"]
