[project]
name = "hexharness"
version = "0.1.0"
description = "Agentic pentesting harness with a hard domain control plane (scope, ROE, evidence, budget)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "pyyaml>=6",
    "ddgs>=6.0",  # free default web_search backend (Tavily/Exa optional, via stdlib HTTP + key)
    "dnspython>=2.6",  # native dns_enum resolver (no sandbox tool needed)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
# Each group is lazy-imported; the core install and the test suite run without any of them.
openai = ["openai>=1.40"]        # also powers OllamaProvider (OpenAI-compatible endpoint)
google = ["google-genai>=0.3"]
otel = ["opentelemetry-sdk>=1.20"]
daemon = ["websockets>=12"]
reporting = ["jinja2>=3", "weasyprint>=60", "docxtpl>=0.16"]
mcp = ["mcp>=1.0"]
tui = ["textual>=0.60"]
voice = ["sounddevice>=0.4", "faster-whisper>=1.0", "numpy>=1.26"]
search = ["ddgs>=6.0"]  # kept for back-compat; ddgs is now a core dep so web_search works out of the box
all = [
    "openai>=1.40", "google-genai>=0.3", "opentelemetry-sdk>=1.20",
    "websockets>=12", "jinja2>=3", "weasyprint>=60", "docxtpl>=0.16", "mcp>=1.0",
    "textual>=0.60", "sounddevice>=0.4", "faster-whisper>=1.0", "numpy>=1.26", "ddgs>=6.0",
]

[project.scripts]
hexharness = "hexharness.__main__:main"

[tool.setuptools.packages.find]
include = ["hexharness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
